name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && go mod download
      - run: go vet ./...
      - run: go test ./...
      - name: Benchmark ingestion and delivery
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'feat/reliability-and-demo'
        run: go test ./tests/integration -run '^$' -bench 'Benchmark(EventIngestion|PublishToAcknowledgedDelivery)$' -benchtime=3s -count=1 -v
