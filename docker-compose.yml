services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    build:
      context: .
      args: {TARGET: migrate}
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: .
      args: {TARGET: api}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      ENCRYPTION_KEY_BASE64: ${ENCRYPTION_KEY_BASE64:?Set ENCRYPTION_KEY_BASE64 in .env}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-local-v1}
      EVENT_RATE_LIMIT_PER_MINUTE: ${EVENT_RATE_LIMIT_PER_MINUTE:-600}
      MANAGEMENT_RATE_LIMIT_PER_MINUTE: ${MANAGEMENT_RATE_LIMIT_PER_MINUTE:-120}
      REDIS_URL: redis://redis:6379/0
      DEMO_RECEIVER_ORIGIN: ${DEMO_RECEIVER_ORIGIN:-}
      # Console sign-in (optional; see .env.example). Local email goes to the API log.
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
      IP_HASH_KEY_BASE64: ${IP_HASH_KEY_BASE64:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      MAIL_LOG_BODIES: ${MAIL_LOG_BODIES:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MAGIC_LINK_PER_EMAIL_PER_HOUR: ${MAGIC_LINK_PER_EMAIL_PER_HOUR:-5}
      MAGIC_LINK_PER_IP_PER_HOUR: ${MAGIC_LINK_PER_IP_PER_HOUR:-20}
      OAUTH_START_PER_IP_PER_HOUR: ${OAUTH_START_PER_IP_PER_HOUR:-30}
      MAX_WORKSPACES_PER_USER: ${MAX_WORKSPACES_PER_USER:-3}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
  dispatcher:
    build:
      context: .
      args: {TARGET: dispatcher}
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: .
      args: {TARGET: worker}
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      ENCRYPTION_KEY_BASE64: ${ENCRYPTION_KEY_BASE64:?Set ENCRYPTION_KEY_BASE64 in .env}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-local-v1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      ENDPOINT_CONCURRENCY_LIMIT: ${ENDPOINT_CONCURRENCY_LIMIT:-100}
      TENANT_CONCURRENCY_LIMIT: ${TENANT_CONCURRENCY_LIMIT:-10}
      WORKER_DRAIN_SECONDS: ${WORKER_DRAIN_SECONDS:-35}
      DEMO_RECEIVER_ORIGIN: ${DEMO_RECEIVER_ORIGIN:-}
    stop_grace_period: 45s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
  receiver:
    profiles: ["demo"]
    build:
      context: .
      args: {TARGET: demo-receiver}
    ports:
      - "127.0.0.1:${DEMO_RECEIVER_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./web/dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:3000"
    environment:
      RELAYFORGE_API_URL: http://api:8080
      DASHBOARD_SESSION_KEY: ${DASHBOARD_SESSION_KEY:-}
      DASHBOARD_SECURE_COOKIES: "false"
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
