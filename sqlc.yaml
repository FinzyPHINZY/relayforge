version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "db/migrations/000001_foundation.up.sql"
      - "db/migrations/000002_delivery_engine.up.sql"
      - "db/migrations/000003_recovery.up.sql"
      - "db/migrations/000004_retention.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
