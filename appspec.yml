version: 0.0
os: linux
files:
  - source: /
    destination: /opt/relayforge/current
hooks:
  AfterInstall:
    - location: deploy/aws/check-on-host.sh
      timeout: 3600
      runas: root
  ApplicationStart:
    - location: deploy/aws/start-on-host.sh
      timeout: 3600
      runas: root
  ValidateService:
    - location: deploy/aws/verify-on-host.sh
      timeout: 600
      runas: root
