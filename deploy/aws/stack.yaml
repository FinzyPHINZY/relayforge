AWSTemplateFormatVersion: '2010-09-09'
Description: RelayForge single-host deployment and GitHub-driven check-and-deploy pipeline in eu-north-1.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  GitHubConnectionArn:
    Type: String
    Description: Authorized CodeConnections GitHub connection ARN.
  RepositoryId:
    Type: String
    Default: FinzyPHINZY/relayforge
  DashboardDomain:
    Type: String
    Default: relayforge.site
  ApiDomain:
    Type: String
    Default: api.relayforge.site
  InstanceType:
    Type: String
    Default: m7i-flex.large
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  ReleaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores CodePipeline artifacts and immutable source releases for the deployment host.
        must: Keep private, encrypted, and retained across stack deletion.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
  ReleaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Rejects plaintext transport to deployment artifacts.
        must: Keep HTTPS enforcement.
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ReleaseBucket.Arn
              - !Sub '${ReleaseBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Publishes only HTTP challenge and HTTPS through Caddy; administration uses SSM.
        must: Never open SSH or database ports.
    Properties:
      GroupDescription: RelayForge HTTPS ingress; no SSH
      VpcId: vpc-07e46ab20b5c84c2c
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: relayforge-host
  HostRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Lets the deployment host receive SSM commands and read release archives.
        must: Do not grant repository or broad S3 access.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-releases
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ReleaseBucket.Arn}/releases/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ReleaseBucket.Arn}/bootstrap/*'
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Metadata:
      com.aws.cloudformation.Context:
        why: Attaches SSM and release-read credentials to the EC2 host.
        must: Use the host role only.
    Properties:
      Roles: [!Ref HostRole]
  Host:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Runs the existing Compose application, PostgreSQL, Redis, and HTTPS proxy.
        must: Preserve the instance and its encrypted root volume until data migration is planned.
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      SubnetId: subnet-051dd2090ee8b5f84
      SecurityGroupIds: [!Ref HostSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: relayforge-app
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf update -y
          dnf install -y docker curl ruby wget openssl
          systemctl enable --now docker
          usermod -aG docker ec2-user
          mkdir -p /usr/local/lib/docker/cli-plugins /etc/relayforge /opt/relayforge/releases
          curl -fsSL https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          password=$(openssl rand -hex 24)
          printf '%s' "$password" >/etc/relayforge/postgres_password
          chmod 0600 /etc/relayforge/postgres_password
          encryption_key=$(openssl rand -base64 32)
          session_key=$(openssl rand -base64 32)
          cat >/etc/relayforge/relayforge.env <<EOF
          DB_SECRET_PATH=/etc/relayforge/postgres_password
          DATABASE_URL=postgres://webhooks:$password@postgres:5432/webhooks?sslmode=disable
          ENCRYPTION_KEY_BASE64=$encryption_key
          ENCRYPTION_KEY_ID=aws-v1
          DASHBOARD_SESSION_KEY=$session_key
          DASHBOARD_SECURE_COOKIES=true
          RELAYFORGE_DASHBOARD_DOMAIN=${DashboardDomain}
          RELAYFORGE_API_DOMAIN=${ApiDomain}
          COMPOSE_PROFILES=public
          EOF
          chmod 0600 /etc/relayforge/relayforge.env
  HostAddress:
    Type: AWS::EC2::EIP
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps the two Namecheap DNS A records stable through host restarts.
        must: Keep associated with the deployment host.
    Properties:
      Domain: vpc
      InstanceId: !Ref Host
  DomainZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds the dashboard and API records after Namecheap nameserver delegation.
        must: Preserve the hosted zone during routine stack updates.
    Properties:
      Name: !Ref DashboardDomain
  DashboardRecord:
    Type: AWS::Route53::RecordSet
    Metadata:
      com.aws.cloudformation.Context:
        why: Directs the dashboard domain to the fixed EC2 address.
        must: Keep aligned with HostAddress.
    Properties:
      HostedZoneId: !Ref DomainZone
      Name: !Ref DashboardDomain
      Type: A
      TTL: '300'
      ResourceRecords: [!Ref HostAddress]
  ApiRecord:
    Type: AWS::Route53::RecordSet
    Metadata:
      com.aws.cloudformation.Context:
        why: Directs the API subdomain to the fixed EC2 address.
        must: Keep aligned with HostAddress.
    Properties:
      HostedZoneId: !Ref DomainZone
      Name: !Ref ApiDomain
      Type: A
      TTL: '300'
      ResourceRecords: [!Ref HostAddress]
  BuildRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Runs merge checks and sends the approved release to the SSM host.
        must: Scope S3 writes to the release bucket and SSM to this host.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-and-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:eu-north-1:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-checks:*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${ReleaseBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ReleaseBucket.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:eu-north-1::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ec2:eu-north-1:${AWS::AccountId}:instance/${Host}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
  BuildProject:
    Type: AWS::CodeBuild::Project
    Metadata:
      com.aws.cloudformation.Context:
        why: Re-runs repository checks on main before deploying the exact commit.
        must: Stop the build on test failure.
    Properties:
      Name: !Sub '${AWS::StackName}-checks'
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: deploy/aws/buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: RELEASE_BUCKET
            Value: !Ref ReleaseBucket
          - Name: INSTANCE_ID
            Value: !Ref Host
      TimeoutInMinutes: 60
  PipelineRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Reads GitHub main through CodeConnections and starts the check-and-deploy build.
        must: Restrict the connection and build project to this pipeline.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: source-and-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn
                Condition:
                  StringEquals:
                    codeconnections:FullRepositoryId: !Ref RepositoryId
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ReleaseBucket.Arn
                  - !Sub '${ReleaseBucket.Arn}/*'
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt BuildProject.Arn
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Metadata:
      com.aws.cloudformation.Context:
        why: Triggers on each main merge, then runs checks and deploys that commit.
        must: Keep source restricted to main and one execution at a time.
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      RoleArn: !GetAtt PipelineRole.Arn
      PipelineType: V2
      ExecutionMode: QUEUED
      ArtifactStore:
        Type: S3
        Location: !Ref ReleaseBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubMain
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: main
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1
        - Name: CheckAndDeploy
          Actions:
            - Name: ChecksThenDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceCode
              RunOrder: 1
Outputs:
  InstanceId:
    Value: !Ref Host
  PublicIp:
    Value: !Ref HostAddress
  NameServers:
    Value: !Join [', ', !GetAtt DomainZone.NameServers]
  PipelineName:
    Value: !Ref Pipeline
