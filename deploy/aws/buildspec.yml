version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - go version
  build:
    commands:
      - go mod download
      - go vet ./...
      - go test ./...
      - cd web/dashboard && pnpm install --frozen-lockfile && pnpm test && pnpm typecheck && pnpm build
      - cd ../.. && web/dashboard/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json && node sdk/typescript/test/client.test.mjs
      - bash deploy/aws/publish-and-deploy.sh
