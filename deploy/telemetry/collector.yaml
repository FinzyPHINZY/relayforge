receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prometheus]
